# Generates a lime contribution-graph snake and publishes it to the `output` branch.
# Runs daily, and can be started manually from the Actions tab.
name: snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#B6FF3B&color_dots=#11160F,#26360F,#4F6E1A,#86B82B,#B6FF3B&color_dot_border=#07090A&color_background=#07090A

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
